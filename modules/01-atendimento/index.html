<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella Massa - Atendimento</title>
  <link rel="stylesheet" href="estilo.css">
</head>

<body>


  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="form-box no-print">
      <div class="container">
        <header>
          <div class="brand-title">
            <span class="pizza-icon" title="Clique para girar!">🍕</span>
            <h1>Bella Massa | Atendimento</h1>
          </div>

          <!-- Controles de Tema Padronizados (Sol / Lua) -->
          <div class="header-right">
            <div class="theme-switch">
              <button type="button" id="btnLight" onclick="setTheme('light')" title="Clarear modo"
                aria-label="Clarear">☀️</button>
              <button type="button" id="btnDark" onclick="setTheme('dark')" title="Escurecer modo"
                aria-label="Escurecer">🌙</button>
            </div>
          </div>
        </header>

        <!-- Modalidade de Atendimento -->
        <div class="form-group">
          <label>Modalidade de Atendimento</label>
          <div class="option-group" id="modalityGroup">
            <label class="option-card">
              <input type="radio" name="modality" value="Balcao" checked onchange="toggleModalityFields()">
              <span>🍕 Balcão</span>
            </label>
            <label class="option-card">
              <input type="radio" name="modality" value="Salao" onchange="toggleModalityFields()">
              <span>🪑 Salão / Mesa</span>
            </label>
            <label class="option-card">
              <input type="radio" name="modality" value="Entrega" onchange="toggleModalityFields()">
              <span>🛵 Entrega (Delivery)</span>
            </label>
          </div>
        </div>

        <!-- Campo Mesa -->
        <div class="form-group hidden" id="mesaGroup">
          <label for="mesaInput">Número da Mesa *</label>
          <input type="number" id="mesaInput" min="1" step="1" placeholder="Ex: 05">
        </div>

        <!-- Campos Entrega -->
        <div id="deliveryGroup" class="hidden">
          <div class="form-group">
            <label for="cepInput">CEP da Entrega</label>
            <div class="cep-container">
              <input type="text" id="cepInput" placeholder="Ex: 07043000" maxlength="8" onblur="buscarCEP(this.value)">
              <button type="button" class="btn-primary btn-cep-buscar"
                onclick="buscarCEP(document.getElementById('cepInput').value)">Buscar</button>
            </div>
          </div>
          <div class="form-group">
            <label for="addressInput">Endereço de Entrega *</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="text" id="addressInput" placeholder="Rua, Bairro, Cidade - UF" style="flex: 1;">
              <a id="mapsLink" href="#" target="_blank"
                style="display: none; background: #2E7D32; color: #FBFADA; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: 600; text-align: center; white-space: nowrap;">Ver
                no Maps</a>
            </div>
          </div>

          <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
              <label for="numeroInput">Número *</label>
              <input type="text" id="numeroInput" placeholder="Ex: 123">
            </div>
            <div class="form-group" style="flex: 2;">
              <label for="complementoInput">Complemento</label>
              <input type="text" id="complementoInput" placeholder="Ex: Apto 42, Bloco B">
            </div>
          </div>

          <div class="form-group">
            <label for="deliveryFeeInput">Taxa de Entrega (R$) <small id="distanciaInfo"
                style="color: var(--cheese-gold); font-weight: normal;"></small></label>
            <input type="number" id="deliveryFeeInput" value="7.00" min="7.00" step="0.50" onchange="renderOrder()">
          </div>
        </div>

        <!-- Categoria do Item -->
        <div class="form-group">
          <label>Categoria do Item</label>
          <div class="option-group" id="categoryGroup">
            <label class="option-card">
              <input type="radio" name="category" value="pizza_salgada" onchange="handleCategoryChange()">
              <span>🍕 Pizza Salgada</span>
            </label>
            <label class="option-card">
              <input type="radio" name="category" value="pizza_doce" onchange="handleCategoryChange()">
              <span>🍓 Pizza Doce</span>
            </label>
            <label class="option-card">
              <input type="radio" name="category" value="bebida" onchange="handleCategoryChange()">
              <span>🥤 Bebidas</span>
            </label>
          </div>
        </div>

        <!-- Tamanho da Pizza -->
        <div class="form-group hidden" id="sizeGroupContainer">
          <label>Tamanho da Pizza</label>
          <select id="sizeSelect" onchange="updatePizzaFlavorPrices()">
            <option value="Selecione" disabled selected>Selecione</option>
            <option value="Broto" data-ratio="0.70">Broto (4 Fatias)</option>
            <option value="Media" data-ratio="0.85">Média (6 Fatias)</option>
            <option value="Grande" data-ratio="1.00">Grande (8 Fatias)</option>
            <option value="Familia" data-ratio="1.20">Família (12 Fatias)</option>
          </select>
        </div>

        <!-- Tipo de Montagem -->
        <div class="form-group hidden" id="pizzaDivisionGroup">
          <label>Tipo de Montagem / Sabores</label>
          <div class="option-group">
            <label class="option-card">
              <input type="radio" name="pizzaTypeDivision" value="inteira" checked onchange="togglePizzaDivision()">
              <span>1 Inteira</span>
            </label>
            <label class="option-card">
              <input type="radio" name="pizzaTypeDivision" value="meio_a_meio" onchange="togglePizzaDivision()">
              <span>2 Meio a Meio</span>
            </label>
          </div>
        </div>

        <div id="pizzaFlavorsGroup" class="hidden">
          <div class="form-group">
            <label for="flavor1Select" id="labelFlavor1">Sabor da Pizza</label>
            <select id="flavor1Select">
              <option value="" disabled selected>Selecione o sabor</option>
              <option value="Calabresa">Calabresa</option>
              <option value="Mussarela">Mussarela</option>
              <option value="Marguerita">Marguerita</option>
              <option value="Portuguesa">Portuguesa</option>
              <option value="Frango com Catupiry">Frango com Catupiry</option>
              <option value="Quatro Queijos">Quatro Queijos</option>
              <option value="Bacon">Bacon</option>
              <option value="Toscana">Toscana</option>
              <option value="Brócolis com Bacon">Brócolis com Bacon</option>
              <option value="Lombo Canadense">Lombo Canadense</option>
              <option value="Baiana">Baiana</option>
              <option value="Pepperoni">Pepperoni</option>
            </select>
          </div>

          <div class="form-group hidden" id="flavor2Container">
            <label for="flavor2Select">Sabor 2 (Meio a Meio)</label>
            <select id="flavor2Select">
              <option value="Nenhum" selected>Selecione o segundo sabor</option>
              <option value="Calabresa">Calabresa</option>
              <option value="Mussarela">Mussarela</option>
              <option value="Marguerita">Marguerita</option>
              <option value="Portuguesa">Portuguesa</option>
              <option value="Frango com Catupiry">Frango com Catupiry</option>
              <option value="Quatro Queijos">Quatro Queijos</option>
              <option value="Bacon">Bacon</option>
              <option value="Toscana">Toscana</option>
              <option value="Brócolis com Bacon">Brócolis com Bacon</option>
              <option value="Lombo Canadense">Lombo Canadense</option>
              <option value="Baiana">Baiana</option>
              <option value="Pepperoni">Pepperoni</option>
            </select>
          </div>
        </div>

        <!-- Bebidas -->
        <div class="form-group hidden" id="drinkGroup">
          <label for="drinkSelect">Bebidas</label>
          <select id="drinkSelect">
            <option value="" disabled selected>Selecione a bebida</option>
            <option value="Coca-Cola 2L">Coca-Cola 2L - R$ 14,00</option>
            <option value="Guaraná Antarctica 2L">Guaraná Antarctica 2L - R$ 12,00</option>
            <option value="Fanta Laranja 2L">Fanta Laranja 2L - R$ 12,00</option>
            <option value="Sprite 2L">Sprite 2L - R$ 12,00</option>
            <option value="Coca-Cola Lata 350ml">Coca-Cola Lata 350ml - R$ 6,00</option>
            <option value="Guaraná Lata 350ml">Guaraná Lata 350ml - R$ 6,00</option>
            <option value="Suco Del Valle Uva 1L">Suco Del Valle Uva 1L - R$ 9,00</option>
            <option value="Água Sem Gás 500ml">Água Sem Gás 500ml - R$ 4,00</option>
            <option value="Água Com Gás 500ml">Água Com Gás 500ml - R$ 4,50</option>
          </select>
        </div>

        <!-- Borda -->
        <div class="form-group hidden" id="borderGroup">
          <label for="borderSelect">Borda Recheada</label>
          <select id="borderSelect">
            <option value="" disabled selected>Selecione o recheio da borda</option>
            <option value="Sem recheio">Sem recheio - R$ 00,00</option>
            <option value="Brigadeiro">Brigadeiro - R$ 20,00</option>
            <option value="Chocolate">Chocolate - R$ 18,00</option>
            <option value="Caturipy">Caturipy - R$ 20,00</option>
            <option value="Cheddar">Cheddar - R$ 14,00</option>

          </select>
        </div>

        <!-- Observações -->
        <div class="form-group">
          <label for="obsInput">Observações / Personalização</label>
          <input type="text" id="obsInput" placeholder="Coloque aqui observações, restrições ou pedidos especiais.">
        </div>

        <!-- Quantidade -->
        <div class="form-group">
          <label for="quantityInput">Quantidade *</label>
          <input type="number" id="quantityInput" value="1" min="1" step="1">
        </div>
        <button type="button" class="btn-primary btn-add" onclick="addItem()">+ Adicionar ao Pedido</button>

        <!-- Tabela Resumo -->
        <table class="order-table" style="width: 100%; margin-top: 20px; border-collapse: collapse;">
          <thead>
            <tr style="text-align: left; border-bottom: 1px solid var(--border-color);">
              <th style="padding: 8px;">Qtd. / Item</th>
              <th style="padding: 8px;">Detalhes / Borda</th>
              <th style="padding: 8px;">Subtotal</th>
              <th style="padding: 8px; text-align: center;">Ação</th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>

        <div class="total-container"
          style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 1.1rem; font-weight: bold;">
          <span>Total do Pedido:</span>
          <span class="total-price" id="totalPrice" style="color: var(--cheese-gold);">R$ 0,00</span>
        </div>

        <!-- Forma de Pagamento -->
        <div class="form-group" style="margin-top: 20px;">
          <label>Forma de Pagamento</label>
          <div class="option-group" id="paymentMethodGroup">
            <label class="option-card">
              <input type="radio" name="paymentMethod" value="Cartão de Crédito" onchange="toggleCashFields()">
              <span>💳 Crédito</span>
            </label>
            <label class="option-card">
              <input type="radio" name="paymentMethod" value="Cartão de Débito" onchange="toggleCashFields()">
              <span>💳 Débito</span>
            </label>
            <label class="option-card">
              <input type="radio" name="paymentMethod" value="Pix" onchange="toggleCashFields()">
              <span>💠 Pix</span>
            </label>
            <label class="option-card">
              <input type="radio" name="paymentMethod" value="Dinheiro" onchange="toggleCashFields()">
              <span>💵 Dinheiro</span>
            </label>
          </div>
        </div>

        <div class="form-group hidden" id="cashGroup">
          <label for="cashAmountInput">Valor Pago pelo Cliente (R$)</label>
          <input type="number" id="cashAmountInput" step="0.50" placeholder="Ex: 100.00" oninput="calculateChange()">
          <div id="changeDisplay" style="margin-top: 5px; font-weight: bold; color: #D32F2F;">Troco: R$ 0,00</div>
        </div>

        <button class="btn-primary" onclick="confirmOrder()">🔥 Confirmar e Enviar para o Forno</button>
      </div>
    </div>
  </main>

  <!-- Modal de Erro Obrigatório -->
  <div id="validationModal" class="modal hidden" style="text-align: center;">
    <div class="modal-content">
      <h2 style="color: var(--pizza-red); margin-bottom: 10px;">⚠️ Atenção</h2>
      <p id="validationModalMessage" style="font-size: 1.1rem; margin-bottom: 20px;">Selecione uma forma de pagamento!
      </p>
      <button class="btn-primary" onclick="closeValidationModal()">OK</button>
    </div>
  </div>

  <!-- Modal de Recibo -->
  <div id="receiptModal" class="modal hidden">
    <div class="modal-content" id="printArea">
      <h2 style="margin-bottom: 15px;">🎉 Pedido Gerado!</h2>
      <div class="modal-details" id="receiptDetails" style="line-height: 1.6;"></div>
      <div class="no-print" style="margin-top: 20px;">
        <button class="btn-primary" onclick="imprimirPedidoPDF()"
          style="margin-bottom: 10px; background-color: #555;">🖨️ Imprimir / Salvar PDF</button>
        <button class="btn-primary" onclick="closeModal()">Novo Pedido</button>
      </div>
    </div>
  </div>

  <!-- VLibras -->
  <div vw class="enabled no-print">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js" class="no-print"></script>
  <script class="no-print">
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <script src="../../database.js"></script>
  <script src="app.js"></script>
</body>

</html>
