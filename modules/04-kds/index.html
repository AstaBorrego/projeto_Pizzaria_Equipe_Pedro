<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Massa | KDS - Cozinha</title>
  <link rel="stylesheet" href="css/kds.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="brand-title">
        <span class="pizza-icon" title="Cozinha">🍕</span>
        <div>
          <span class="eyebrow">Módulo 04</span>
          <h1>KDS - <strong>Cozinha</strong></h1>
          <p>Acompanhe e gerencie os pedidos em tempo real</p>
        </div>
      </div>

      <div class="header-right">
        <!-- BOTÕES DE ALTERNÂNCIA DE TEMA -->
        <div class="theme-switch">
          <button type="button" id="btnLight" onclick="setTheme('light')" title="Clarear modo" aria-label="Clarear">☀️ Clarear</button>
          <button type="button" id="btnDark" onclick="setTheme('dark')" title="Escurecer modo" aria-label="Escurecer">🌙 Escurecer</button>
        </div>
        <div class="topbar-status">
          <div class="connection"><span class="dot"></span> Conectado</div>
          <div class="clock-box"><small id="date"></small><strong id="clock">--:--:--</strong></div>
        </div>
      </div>
    </header>

    <main class="main-content-kds">
      <section class="kds-grid">
        <div class="column queue">
          <div class="column-header">
            <div class="column-title">
              <span class="title-icon">⌛</span>
              <div>
                <h2>Fila de Pedidos <span id="queueCount" class="count">0</span></h2>
                <p>Pedidos aguardando preparo</p>
              </div>
            </div>
          </div>
          <div id="queueList" class="orders-list"></div>
        </div>

        <div class="column preparing">
          <div class="column-header">
            <div class="column-title">
              <span class="title-icon">⚙</span>
              <div>
                <h2>Em Preparo <span id="preparingCount" class="count">0</span></h2>
                <p>Pedidos em produção</p>
              </div>
            </div>
          </div>
          <div id="preparingList" class="orders-list"></div>
        </div>

        <div class="column ready">
          <div class="column-header">
            <div class="column-title">
              <span class="title-icon">✓</span>
              <div>
                <h2>Prontos <span id="readyCount" class="count">0</span></h2>
                <p>Finalizados, aguardando expedição</p>
              </div>
            </div>
          </div>
          <div id="readyList" class="orders-list"></div>
        </div>
      </section>

      <footer class="summary-bar">
        <div class="summary-item">
          <span class="summary-icon red">▥</span>
          <div><strong id="dayOrders">0</strong><span>Pedidos no dia</span></div>
        </div>
        <div class="summary-item">
          <span class="summary-icon red">◷</span>
          <div><strong id="avgTime">0 min</strong><span>Tempo médio</span></div>
        </div>
        <div class="summary-item">
          <span class="summary-icon green">✓</span>
          <div><strong id="finalized">0</strong><span>Finalizados</span></div>
        </div>
        <button class="refresh" id="refreshBtn" onclick="carregarPedidosKDS()">⟳ Atualizar</button>
      </footer>
    </main>
  </div>

  <!-- Widget VLIBRAS -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  
  <div id="toast" class="toast"></div>

  <!-- CARREGAMENTO DOS SCRIPTS NA ORDEM CORRETA -->
  <script src="../../database.js"></script>
  <script src="js/kds.js"></script>
</body>
</html>
